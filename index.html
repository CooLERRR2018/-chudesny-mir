/* =========================================================
   ОСНОВА
========================================================= */

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
padding:0;
width:100%;
min-height:100%;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Arial,
sans-serif;

background:
radial-gradient(
circle at 50% 0%,
#321b52 0%,
#170d29 42%,
#09050f 100%
);

}

body{
min-height:100vh;
overflow-x:hidden;
}

button{
font-family:inherit;
}


/* =========================================================
   ЗВЁЗДЫ
========================================================= */

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
opacity:.45;

background-image:
radial-gradient(
circle at 10% 20%,
rgba(255,255,255,.8) 0 1px,
transparent 1.5px
),
radial-gradient(

),

transparent 1.5px
),

circle at 90% 80%,
rgba(255,255,255,.7) 0 1px,
transparent 1.5px
);

background-size:
170px 170px,
230px 230px,
190px 190px,
260px 260px;

z-index:0;
}


/* =========================================================
   APP
========================================================= */

.app{
position:relative;
z-index:1;

width:100%;
max-width:500px;

min-height:100vh;

margin:0 auto;

18px
18px

/* =========================================================

========================================================= */

.header{
display:flex;
align-items:center;
justify-content:space-between;

gap:12px;

margin-bottom:18px;
}

.logo{
font-size:20px;

linear-gradient(
90deg,
#fff,
#d8b8ff
);

}

}

align-items:center;

padding:9px 13px;

border:1px solid rgba(255,255,255,.12);
border-radius:16px;

background:rgba(255,255,255,.07);

box-shadow:
0 5px 25px rgba(0,0,0,.2);
}

.balance-icon{
font-size:16px;
}

.balance-value{
font-size:14px;
font-weight:800;
}

.balance-status{

color:rgba(255,255,255,.45);
}

.balance-status.error{

}

.balance-status.success{

}


/* =========================================================
   MAIN CARD
========================================================= */

.main-card{
position:relative;

padding:25px 20px 22px;

border-radius:27px;

background:
linear-gradient(
145deg,
rgba(60,30,95,.82),
rgba(20,11,37,.88)
);

border:1px solid rgba(255,255,255,.10);

box-shadow:
0 20px 70px rgba(0,0,0,.38),
inset 0 0 35px rgba(185,100,255,.04);

overflow:hidden;
}

.main-card:after{
content:"";

position:absolute;

width:220px;
height:220px;

right:-100px;
top:-100px;

border-radius:50%;

background:
rgba(170,90,255,.12);

filter:blur(50px);

pointer-events:none;
}

.eyebrow{
font-size:10px;
letter-spacing:2px;

color:#bfa7d8;

margin-bottom:9px;
}

.title{
font-size:28px;
font-weight:900;

line-height:1.05;

margin-bottom:10px;
}

.subtitle{
font-size:13px;
line-height:1.5;

color:rgba(255,255,255,.6);
}


/* =========================================================
   BUTTONS
========================================================= */

.primary-btn{
width:100%;

border:0;

padding:15px 18px;

border-radius:17px;

font-size:14px;
font-weight:800;

color:#fff;

background:
linear-gradient(
135deg,
#8f4dce,
#5d2b91
);

box-shadow:
0 10px 30px rgba(126,63,190,.28);

cursor:pointer;

transition:
transform .15s ease,
filter .15s ease;
}

.primary-btn:active{
transform:scale(.97);
filter:brightness(.9);
}

.primary-btn:disabled{
opacity:.6;
cursor:default;
}

.secondary-btn{
width:100%;

border:1px solid rgba(255,255,255,.13);

padding:14px 18px;

border-radius:16px;

background:rgba(255,255,255,.06);

color:#fff;

font-weight:700;

cursor:pointer;
}

.topup-btn{

background:rgba(139,73,195,.12);

color:#dcbaff;

border-radius:12px;

padding:7px 10px;

font-size:11px;
font-weight:800;

cursor:pointer;
}


/* =========================================================
   SECTION
========================================================= */

.section{
margin-top:17px;
}

.section-title{
font-size:16px;
font-weight:800;

margin-bottom:10px;
}


/* =========================================================
   BONUS
========================================================= */

.bonus-card{

border-radius:19px;

linear-gradient(
135deg,
rgba(83,44,125,.65),

);

}

.bonus-card.hidden{

}

.bonus-title{

font-weight:800;

margin-bottom:6px;
}

.bonus-text{
font-size:12px;
line-height:1.45;

color:rgba(255,255,255,.58);

margin-bottom:12px;
}

.bonus-btn{
width:100%;

border:1px solid rgba(198,140,255,.35);

padding:11px;

border-radius:13px;

font-weight:800;

}


/* =========================================================
   DAILY CARD
========================================================= */

.daily-card{
margin-top:17px;

padding:18px;

border-radius:22px;

background:
linear-gradient(
145deg,
rgba(49,28,74,.85),
rgba(20,10,34,.92)
);

border:1px solid rgba(255,255,255,.08);
}

.daily-label{
font-size:10px;
letter-spacing:2px;

color:#a88bc4;

margin-bottom:6px;
}

.daily-title{
font-size:20px;
font-weight:900;

margin-bottom:6px;
}

.daily-description{
font-size:12px;
line-height:1.5;

color:rgba(255,255,255,.58);
}

.daily-button{
margin-top:15px;

width:100%;

padding:13px;

border:1px solid rgba(255,255,255,.12);

border-radius:14px;

background:
linear-gradient(
135deg,
rgba(143,77,206,.4),
rgba(72,34,110,.4)
);

color:#fff;

font-weight:800;

cursor:pointer;
}

.daily-button:disabled{
opacity:.6;
}


/* =========================================================
   MENU
========================================================= */

.menu{
display:grid;

grid-template-columns:
repeat(3,1fr);

gap:9px;

margin-top:18px;
}

.menu-item{
min-height:88px;

border-radius:18px;

padding:13px 8px;

border:1px solid rgba(255,255,255,.08);

background:rgba(255,255,255,.045);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-align:center;

cursor:pointer;

transition:.15s;
}

.menu-item:active{
transform:scale(.96);
}

.menu-icon{
font-size:22px;

margin-bottom:6px;
}

.menu-name{
font-size:11px;

font-weight:800;
}

.menu-small{
font-size:9px;

color:rgba(255,255,255,.4);

margin-top:3px;
}


/* =========================================================
   MODAL
========================================================= */

.overlay{
position:fixed;

inset:0;

background:rgba(5,2,10,.78);

backdrop-filter:blur(10px);

display:flex;

align-items:flex-end;

z-index:100;

opacity:0;

pointer-events:none;

transition:opacity .2s ease;
}

.overlay.active{
opacity:1;

pointer-events:auto;
}

.modal{
width:100%;

max-width:500px;

margin:0 auto;

padding:20px 18px 28px;

border-radius:
28px 28px 0 0;

background:
linear-gradient(
180deg,
#241238 0%,
#10091b 100%
);

border-top:
1px solid rgba(255,255,255,.1);

max-height:88vh;

overflow-y:auto;

transform:translateY(30px);

transition:
transform .25s ease;
}

.overlay.active .modal{
transform:translateY(0);
}

.modal-handle{
width:42px;
height:4px;

border-radius:10px;

background:rgba(255,255,255,.2);

margin:0 auto 18px;
}

.modal-title{
font-size:22px;
font-weight:900;

margin-bottom:6px;
}

.modal-subtitle{
font-size:12px;

color:rgba(255,255,255,.48);

margin-bottom:18px;
}

.spread-list{
display:flex;

flex-direction:column;

gap:10px;
}

.spread-item{
position:relative;

padding:17px;

border-radius:18px;

border:1px solid rgba(255,255,255,.09);

background:
linear-gradient(
135deg,
rgba(61,32,91,.72),
rgba(25,13,41,.82)
);

cursor:pointer;

overflow:hidden;
}

.spread-item:active{
transform:scale(.985);
}

.spread-item.locked{
opacity:.5;

cursor:default;
}

.spread-name{
font-size:14px;

font-weight:900;
}

.spread-desc{
font-size:11px;

line-height:1.4;

color:rgba(255,255,255,.5);

margin-top:5px;

max-width:75%;
}

.spread-price{
position:absolute;

right:15px;
top:15px;

padding:6px 9px;

border-radius:10px;

background:
rgba(178,101,255,.14);

border:
1px solid rgba(205,152,255,.25);

font-size:11px;

font-weight:900;

color:#dcbaff;
}

.close-modal{
margin-top:15px;

width:100%;

padding:12px;

border-radius:14px;

border:
1px solid rgba(255,255,255,.09);

background:
rgba(255,255,255,.05);

color:rgba(255,255,255,.7);

}


/* =========================================================
   TOPUP
========================================================= */

.packages{
display:grid;

grid-template-columns:
repeat(2,1fr);

gap:9px;
}

.package{

}

}

.package-stars{
font-size:16px;

font-weight:900;
}

.package-price{
font-size:11px;

color:rgba(255,255,255,.45);

}

.custom-input{
width:100%;

margin-top:12px;

padding:13px;

1px solid rgba(255,255,255,.1);

color:#fff;

}


/* =========================================================
   TOAST
========================================================= */

.toast{
position:fixed;

left:50%;

bottom:25px;

transform:
translate(-50%,20px);

width:
calc(100% - 36px);

max-width:460px;

padding:13px 15px;

border-radius:15px;

background:
rgba(29,17,44,.96);

border:
1px solid rgba(255,255,255,.12);

box-shadow:
0 10px 35px rgba(0,0,0,.4);

font-size:12px;

opacity:0;

pointer-events:none;

transition:.25s;

z-index:1000;
}

.toast.show{
opacity:1;

transform:
translate(-50%,0);
}


/* =========================================================
   TAROT STAGE
========================================================= */

.tarot-stage{
position:fixed;

inset:0;

z-index:500;

background:
radial-gradient(

}

.stage-stars{

),
radial-gradient(
circle at 75% 20%,
rgba(255,255,255,.7) 0 1px,

),

),

);

150px 150px,

190px 190px,
250px 250px;

}

.stage-glow{

circle,
rgba(162,84,232,.23) 0%,

.stage-content{
position:relative;

z-index:5;

height:100%;

margin:0 auto;

padding:
70px
22px
35px;

.stage-top{

}

}

/* =========================================================
   TAROT CARD
========================================================= */

.card-area{
position:relative;

width:100%;

flex:1;

display:flex;

align-items:center;

justify-content:center;

min-height:300px;
}

.tarot-card{
width:190px;

height:300px;

border-radius:17px;

position:relative;

transform-style:preserve-3d;

transition:
transform .8s cubic-bezier(.2,.8,.2,1),
opacity .5s;

box-shadow:
0 20px 70px rgba(0,0,0,.6),
0 0 35px rgba(160,84,230,.12);

cursor:pointer;
}

.tarot-card.hidden-card{
transform:
rotateY(180deg)
scale(.82);

opacity:0;
}

.tarot-card.show-card{
animation:
cardAppear .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardAppear{

0%{
transform:
translateY(35px)
rotateY(90deg)
scale(.8);

opacity:0;
}

60%{
transform:
translateY(-5px)
rotateY(0)
scale(1.04);

opacity:1;
}

100%{
transform:
translateY(0)
rotateY(0)
scale(1);

opacity:1;
}

}

.card-front{
position:absolute;

inset:0;

border-radius:17px;

overflow:hidden;

background:
linear-gradient(
145deg,
#30184d,
#0c0715
);

border:
1px solid rgba(220,173,255,.35);

display:flex;

align-items:center;

justify-content:center;

backface-visibility:hidden;
}

.card-front:before{
content:"";

position:absolute;

inset:8px;

border-radius:13px;

border:
1px solid rgba(205,153,255,.24);

pointer-events:none;
}

.card-inner{
position:relative;

z-index:2
