<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мир Эзотерики</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  min-height: 100vh;

  background: radial-gradient(circle at top, #38205e, #100b20 65%);

  color: #fff;

  font-family: Georgia, serif;

  text-align: center;

  padding: 35px 20px;

}

h1 {

  color: #e9c77b;

  font-size: 34px;

  margin-top: 30px;

}

.subtitle {

  color: #c9b9df;

  font-size: 16px;

}

.card {

  width: 190px;

  height: 290px;

  margin: 45px auto 25px;

  border: 2px solid #d9b66d;

  border-radius: 16px;

  background: linear-gradient(145deg,#43266c,#170e2c);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 75px;

  box-shadow: 0 0 35px #a477d655;

}

button {

  background: linear-gradient(135deg,#e8ca83,#a77b35);

  color: #21152b;

  border: none;

  padding: 16px 28px;

  border-radius: 30px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

#result {

  color: #e9d8a9;

  line-height: 1.6;

  max-width: 340px;

  margin: 20px auto;

}

</style>

</head>

<body>

<h1>✧ Чудесный мир ✧</h1>

<p class="subtitle">Открой послание, которое приготовила для тебя Вселенная</p>

<div class="card" id="card">🔮</div>

<button onclick="drawCard()">Вытянуть карту</button>

<div id="result">Твоя карта дня ждёт тебя...</div>

<script>

const cards = [

  ["☀️ Солнце","День принесёт радость, ясность и новые возможности. Не бойся проявлять себя."],

  ["🌙 Луна","Прислушайся к интуиции. Не всё сегодня так очевидно, как кажется."],

  ["⭐ Звезда","Не теряй надежду. Даже маленький шаг приближает тебя к мечте."],

  ["❤️ Влюблённые","Обрати внимание на отношения и выбор, который давно откладываешь."],

  ["⚖️ Справедливость","Сегодня важно сохранять честность и принимать взвешенные решения."],

  ["🔮 Маг","У тебя есть ресурсы, чтобы начать что-то новое. Действуй."]

];

function drawCard() {

  const card = cards[Math.floor(Math.random() * cards.length)];

  document.getElementById("card").textContent = card[0].split(" ")[0];

  document.getElementById("result").innerHTML =

    "<b>" + card[0] + "</b>
" 
rd[1];

}

</script>

</body>

</html>
